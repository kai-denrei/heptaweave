<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>heptaweave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

  <!-- PWA. theme_color is the dark stage: the ink theme is the default app. -->
  <link rel="manifest" href="manifest.webmanifest?v=b069c5ac" />
  <meta name="theme-color" content="#08090d" />
  <link rel="apple-touch-icon" href="icon-180.png?v=b069c5ac" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="heptaweave" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Cache-busting (token bumped by scripts/bust.sh). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="cb" content="b069c5ac" />
  <link rel="icon" type="image/svg+xml" href="public/cb-shapes/48.svg?v=b069c5ac" />

  <style>
    :root {
      --bg: #08090d;
      --ink: #fbf7ee;       /* set from the palette's core stop at runtime */
      --glow: #a8abb4;      /* palette's second stop */
      --ember: #a83a2b;
      --dim: rgba(255,255,255,0.44);
      --faint: rgba(255,255,255,0.18);
      --hair: rgba(255,255,255,0.09);
      --ease-out: cubic-bezier(.16,1,.3,1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none; -webkit-user-select: none;
    }
    canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

    .app { position: relative; width: 100%; height: 100%; }
    .screen { position: absolute; inset: 0; z-index: 2; }
    .screen[hidden] { display: none !important; }

    /* ====== LANDING ====== */
    .landing {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 48px;
    }
    .mode-btn {
      font: 400 96px/1 "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", ui-serif, serif;
      color: var(--ink);
      background: transparent;
      border: none;
      padding: 24px 32px;
      cursor: pointer;
      opacity: 0.82;
      filter: drop-shadow(0 0 10px var(--glow));
      transition: transform 120ms var(--ease-out), opacity 200ms;
    }
    .mode-btn:hover, .mode-btn:active { opacity: 1; transform: scale(1.04); }
    /* + sits on the right edge, level with the middle, off the column. */
    .mode-btn[data-mode="COUNT"] {
      position: absolute; right: max(4vw, env(safe-area-inset-right)); top: 50%;
      transform: translateY(-50%); font-size: 84px; padding: 24px;
    }
    .mode-btn[data-mode="COUNT"]:hover, .mode-btn[data-mode="COUNT"]:active { transform: translateY(-50%) scale(1.04); }
    .mode-btn[data-mode="COUNT_C"] {
      position: absolute; left: max(4vw, env(safe-area-inset-left)); top: 50%;
      transform: translateY(-50%); font-size: 84px; padding: 24px;
    }
    .mode-btn[data-mode="COUNT_C"]:hover, .mode-btn[data-mode="COUNT_C"]:active { transform: translateY(-50%) scale(1.04); }
    /* ◎ the ring-stave emblem: medium, top right, a simplified glyph of
       itself (the numeral "12": ring thin→thick, a tip bar, a foot bar). */
    .mode-btn[data-mode="COUNT_R"] {
      position: absolute; right: max(7vw, env(safe-area-inset-right)); top: max(10vh, env(safe-area-inset-top));
      width: 72px; height: 72px; padding: 0; font-size: 0; line-height: 0;
      transform: none;
    }
    .mode-btn[data-mode="COUNT_R"] svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .mode-btn[data-mode="COUNT_R"] .ribbon { fill: currentColor; }
    .mode-btn[data-mode="COUNT_R"] .fig { fill: none; stroke: currentColor; stroke-width: 5.5; stroke-linecap: round; }
    .mode-btn[data-mode="COUNT_R"]:hover, .mode-btn[data-mode="COUNT_R"]:active { transform: scale(1.06); }

    /* ⧉ deep-link copier: an invisible 48 px target in the top-left corner.
       It never shows; a successful copy flashes it once as the only ack. */
    .deep-link {
      position: fixed; left: max(4px, env(safe-area-inset-left)); top: max(4px, env(safe-area-inset-top));
      width: 48px; height: 48px; z-index: 5;
      background: transparent; border: none; padding: 0; cursor: pointer;
      color: var(--ink); font: 400 22px/48px ui-serif, serif; text-align: center;
      opacity: 0; transition: opacity 200ms;
    }
    .deep-link.flash { opacity: 0.7; transition: none; }

    /* ⚙ lab gear: the deep-link's twin in the top-right. Invisible, tappable. */
    .lab-gear {
      position: fixed; right: max(4px, env(safe-area-inset-right)); top: max(4px, env(safe-area-inset-top));
      width: 48px; height: 48px; z-index: 5;
      background: transparent; border: none; padding: 0; cursor: pointer;
      color: var(--ink); font: 400 22px/48px ui-serif, serif; text-align: center; opacity: 0;
    }
    .lab-modal {
      position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .lab-modal[hidden] { display: none; }
    .lab-card {
      width: min(92vw, 380px); max-height: 80vh; overflow-y: auto;
      background: rgba(16, 18, 26, 0.96); color: var(--ink); border: 1px solid var(--hair); border-radius: 14px;
      font: 14px/1.4 -apple-system, system-ui, sans-serif; padding: 14px 16px 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .lab-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
    .lab-close { background: transparent; border: none; color: var(--dim); font: inherit; font-size: 16px; cursor: pointer; padding: 6px; }
    .lab-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--hair); }
    .lab-row:first-child { border-top: none; }
    .lab-label { grid-column: 1; }
    .lab-val { grid-column: 2; grid-row: 1; color: var(--dim); font-variant-numeric: tabular-nums; }
    .lab-row input[type="checkbox"] { grid-column: 2; grid-row: 1; width: 22px; height: 22px; accent-color: var(--ink); margin: 0; }
    .lab-row input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; }
    .lab-foot { font-size: 11px; color: var(--dim); margin-top: 8px; }
    /* inverted: black ink on a clear ground. The fluid flips in the shader;
       the overlays flip here. */
    body.inverted { --ink: #15141a; --glow: rgba(20, 20, 30, 0.22); --dim: #6d6a78; --hair: rgba(0, 0, 0, 0.12); }
    body.inverted .lab-card, body.inverted .admin-sheet { background: rgba(245, 243, 238, 0.96); }
    body.inverted .lab-modal { background: rgba(255, 255, 255, 0.35); }

    /* ====== COUNT ====== */
    .count { display: flex; align-items: center; justify-content: center; }
    /* The numeral is measured and splatted from here; it is never shown. */
    .count-stage { position: absolute; inset: 0; opacity: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
    .count-stage svg { display: block; }
    .mode-btn[data-mode="ENDLESS"] { font-size: 112px; }
    .corner-hold {
      position: absolute; right: 0; bottom: 0;
      width: 72px; height: 72px;
      background: transparent; border: none; cursor: default;
    }
    /* Small link back to the paper theme: a hollow square, bottom-left. */
    .paper-link {
      position: absolute; left: 14px; bottom: max(14px, env(safe-area-inset-bottom));
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      color: var(--faint); text-decoration: none;
      font: 400 22px/1 "Apple Symbols", "Segoe UI Symbol", ui-serif, serif;
    }
    .paper-link:hover { color: var(--dim); }

    /* ====== PLAY ====== */
    .play {
      display: grid;
      grid-template-rows: auto 1fr;
      padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
      gap: 2px;
      pointer-events: none;
    }
    .play-top { position: relative; height: 56px; }
    .score-row {
      position: absolute;
      left: max(8px, env(safe-area-inset-left)); top: 8px; height: 28px;
      color: var(--ink);
      filter: drop-shadow(0 0 6px var(--glow));
    }
    .score-row svg { overflow: visible; display: block; }
    .score-row .new-bit { animation: bitPop 260ms ease-out both; transform-box: fill-box; transform-origin: center; }
    @keyframes bitPop {
      0%   { transform: scale(0.25); opacity: 0; }
      50%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .play-mid {
      position: relative; min-height: 0; height: 100%;
      transition: transform 260ms var(--ease-out);
    }
    /* While the admin sheet is up, lift the stage clear of it so you can see
       the glyph you are tuning. promptBox()/layoutChoices() both measure
       #playMid's rect, so the shift carries the prompt and the tiles. */
    body.admin-open .play-mid { transform: translateY(-26%) scale(0.86); }
    .choices { position: absolute; inset: 0; z-index: 1; }
    .choice-tile {
      position: absolute;
      background: transparent; border: none; border-radius: 50%; padding: 0;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink);
      pointer-events: auto;
      opacity: 0.92;
      filter: drop-shadow(0 0 7px var(--glow));
      transition: transform 80ms ease-out, opacity 500ms var(--ease-out), filter 300ms;
    }
    .choice-tile:active { transform: scale(0.95); }
    .choice-tile.recede { opacity: 0.12; filter: none; }
    .choice-tile.correct { animation: pickCorrect 700ms var(--ease-out) forwards; }
    .choice-tile.wrong   { color: var(--ember); filter: drop-shadow(0 0 10px var(--ember)); animation: pickWrong 700ms ease-out forwards; }
    @keyframes pickCorrect {
      0%   { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 14px var(--ink)); }
      100% { opacity: 0; transform: scale(1.12); filter: drop-shadow(0 0 0 var(--ink)); }
    }
    @keyframes pickWrong {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-4px); }
      40%  { transform: translateX(4px); }
      60%  { transform: translateX(-2px); }
      80%  { transform: translateX(2px); }
      100% { transform: translateX(0); opacity: 0.35; }
    }

    /* ====== GAME OVER ====== */
    .gameover {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; padding: 12px;
      cursor: pointer; overflow: auto;
      color: var(--ink);
    }
    .gameover-dot svg { width: 56px; height: 56px; overflow: visible; filter: drop-shadow(0 0 8px currentColor); }
    .score-trinity { display: flex; flex-direction: column; align-items: center; gap: 14px; filter: drop-shadow(0 0 8px var(--glow)); }
    /* Once the score glyphs are in the ink the SVGs only hold their layout. */
    .gameover.ink-only .score-trinity { opacity: 0; transition: opacity 400ms ease-out; }
    .big-binary { width: min(86vw, 440px); height: 64px; display: flex; align-items: center; justify-content: center; }
    .big-binary svg { width: 100%; height: 100%; overflow: visible; }
    .big-heptacipher, .big-cistercian {
      width: min(58vw, 230px); height: min(58vw, 230px);
      display: flex; align-items: center; justify-content: center; overflow: visible;
    }
    .big-heptacipher svg, .big-cistercian svg { overflow: visible; }
    .install-affordance {
      margin-top: 4px; width: 56px; height: 56px; border-radius: 50%;
      border: 1px solid var(--hair); background: transparent; color: var(--ink);
      font: 400 30px/1 "Apple Symbols", "Segoe UI Symbol", ui-serif, serif;
      display: flex; align-items: center; justify-content: center; opacity: 0.55; cursor: pointer;
    }
    .install-affordance[hidden] { display: none; }

    /* ====== NO WEBGL ====== */
    .nogl {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      color: var(--dim);
      font: 400 72px/1 "Apple Symbols", "Segoe UI Symbol", ui-serif, serif;
    }
    .nogl a { color: var(--ink); text-decoration: none; font-size: 40px; }
    .nogl[hidden] { display: none; }

    /* ====== META-UI: update toast ====== */
    .meta-toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 30;
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px; min-height: 44px;
      background: rgba(14, 15, 20, 0.9);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      border: 1px solid var(--hair); border-radius: 999px;
      font: 400 22px/1 "Apple Symbols", "Segoe UI Symbol", ui-serif, serif;
      cursor: pointer; opacity: 0; pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 240ms ease-out, transform 240ms ease-out;
    }
    .meta-toast[data-visible="1"] { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .meta-toast .dismiss { font-size: 18px; opacity: 0.45; padding: 0 4px; }

    /* ====== ADMIN SHEET (dev surface — text allowed) ====== */
    .admin-sheet {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(100vw, 560px); max-height: 62vh;
      z-index: 20;
      display: flex; flex-direction: column;
      background: rgba(14, 15, 20, 0.86);
      backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid var(--hair); border-bottom: none;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.78);
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: auto;
    }
    .admin-sheet[hidden] { display: none; }
    .admin-sheet.collapsed .ts-body { display: none; }
    .ts-handle {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; cursor: pointer; flex: none;
    }
    .ts-grip { width: 34px; height: 4px; border-radius: 2px; background: var(--faint); }
    .ts-title { flex: 1; letter-spacing: 0.12em; text-transform: uppercase; font-size: 10px; color: var(--dim); }
    .ts-close { color: var(--dim); padding: 4px 6px; }
    .ts-body { overflow-y: auto; padding: 0 14px max(14px, env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
    .ts-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .ts-name {
      flex: 1; min-width: 120px; padding: 8px 10px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--hair); border-radius: 8px;
      color: inherit; font: inherit; outline: none;
    }
    .ts-btn {
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--hair);
      background: rgba(255,255,255,0.07); color: inherit; font: inherit; cursor: pointer;
    }
    .ts-btn:active { background: rgba(255,255,255,0.14); }
    .ts-warn { color: #f0a08a; }
    .ts-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ts-preset { display: inline-flex; }
    .ts-load { border-radius: 8px 0 0 8px; }
    .ts-preset .ts-load:only-child { border-radius: 8px; }
    .ts-del { border-radius: 0 8px 8px 0; border-left: none; color: #f0a08a; padding: 8px 9px; }
    .ts-status { margin-top: 6px; min-height: 14px; color: var(--dim); font-size: 11px; }
    .ts-tabs {
      display: flex; gap: 4px; margin: 14px 0 4px;
      padding-bottom: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      border-bottom: 1px solid var(--hair);
      scrollbar-width: none;
    }
    .ts-tabs::-webkit-scrollbar { display: none; }
    .ts-tab {
      flex: none; padding: 7px 12px; border-radius: 999px;
      border: 1px solid transparent; background: transparent;
      color: var(--dim); font: inherit; cursor: pointer;
      letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px;
    }
    .ts-tab.active { color: var(--ink); border-color: var(--hair); background: rgba(255,255,255,0.07); }
    .ts-pane[hidden] { display: none; }
    .ts-slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 5px 0; }
    .ts-label { color: rgba(255,255,255,0.7); }
    .ts-val { color: var(--ink); min-width: 48px; text-align: right; }
    .ts-slider input[type=range] {
      grid-column: 1 / span 2; width: 100%; height: 26px; margin: 0;
      -webkit-appearance: none; appearance: none; background: transparent;
    }
    .ts-slider input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--faint); border-radius: 2px; }
    .ts-slider input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8.5px;
      border-radius: 50%; background: var(--ink); border: 2px solid var(--bg);
      box-shadow: 0 0 8px var(--glow);
    }
    .ts-slider input[type=range]::-moz-range-track { height: 3px; background: var(--faint); border-radius: 2px; }
    .ts-slider input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); border: 2px solid var(--bg); }
    .ts-json-row { margin-top: 12px; }
    .ts-dump {
      display: block; width: 100%; box-sizing: border-box; min-height: 96px; margin: 6px 0 0; padding: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--hair); border-radius: 6px;
      font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all;
      color: var(--dim); resize: vertical; outline: none;
    }
    .ts-dump:focus { color: inherit; }

    @media (prefers-reduced-motion: reduce) {
      .choice-tile, .mode-btn { transition: none; }
      .choice-tile.correct, .choice-tile.wrong { animation: none; }
      .score-row .new-bit { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="app">
    <button class="deep-link" id="deepLink" type="button" aria-label="copy link" tabindex="-1">⧉</button>
    <button class="lab-gear" id="labGear" type="button" aria-label="lab" tabindex="-1">⚙</button>

    <section class="screen landing" id="screenLanding">
      <button class="mode-btn" data-mode="TIMED" aria-label="Timed mode">⧖</button>
      <button class="mode-btn" data-mode="ENDLESS" aria-label="Endless mode">∞</button>
      <button class="mode-btn" data-mode="COUNT_C" aria-label="Count mode, Cistercian">+</button>
      <button class="mode-btn" data-mode="COUNT" aria-label="Count mode">+</button>
      <button class="mode-btn" data-mode="COUNT_R" aria-label="Count mode, ring-stave numeral">
        <svg viewBox="0 0 100 100" aria-hidden="true">

    <!-- New-version toast. Tap = accept the update (posts SKIP_WAITING, the
         page reloads on controllerchange); ✕ dismisses for this session. -->
    <div class="meta-toast" id="updateToast" role="alert"
         aria-label="new version available" hidden>
      <span class="glyph" aria-hidden="true">↻</span>
      <span class="dismiss" id="updateToastDismiss" role="button" aria-label="dismiss">✕</span>
    </div>

    <div class="nogl" id="nogl" hidden>
      <span aria-hidden="true">⊘</span>
      <a href="paper.html" aria-label="paper theme">▢</a>
    </div>

  <script type="module">
    // ---- Service worker with the opt-in update flow (same contract as the
    // paper page: the worker never skipWaiting()s on its own; we surface a
    // toast and only swap when the player taps it). ----
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' }).then((reg) => {
          const toast = document.getElementById('updateToast');
          const dismiss = document.getElementById('updateToastDismiss');
          if (!toast || !dismiss) return;
          let waitingWorker = null;
          let reloading = false;

          function showUpdateToast(worker) {
            waitingWorker = worker;
            toast.hidden = false;
            requestAnimationFrame(() => requestAnimationFrame(() => {
              toast.dataset.visible = '1';
            }));
          }
          toast.addEventListener('click', (ev) => {
            if (ev.target === dismiss) return;
            if (waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
          });
          dismiss.addEventListener('click', (ev) => {
            ev.stopPropagation();
            toast.dataset.visible = '0';
            setTimeout(() => { toast.hidden = true; }, 280);
          });
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });
          if (reg.waiting && navigator.serviceWorker.controller) showUpdateToast(reg.waiting);
          reg.addEventListener('updatefound', () => {
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateToast(worker);
              }
            });
          });
        }).catch(() => {});
      });
    }

    const cb = document.querySelector('meta[name="cb"]')?.content || String(Date.now());
    const [{ boot }, { createInkRenderer }, { createParams }, { createAdminPanel }, { createLabModal }] = await Promise.all([
      import(`./src/main.js?v=${cb}`),
      import(`./src/render/ink/inkRenderer.js?v=${cb}`),
      import(`./src/params.js?v=${cb}`),
      import(`./src/test/adminPanel.js?v=${cb}`),
      import(`./src/test/labModal.js?v=${cb}`),
    ]);

    const params = createParams({ hash: location.hash });
    const renderer = createInkRenderer({ params });
    let panel = null;
    const app = boot({
      renderer,
      params,
      hash: location.hash,
      onCornerHold: () => { if (panel) panel.toggle(); },
    });
    if (!renderer.ok) {
      document.getElementById('nogl').hidden = false;
      for (const s of document.querySelectorAll('.screen')) s.hidden = true;
    } else {
      panel = createAdminPanel({ params, root: document.body });
      const lab = createLabModal({ params, root: document.body });
      const gear = document.getElementById('labGear');
      gear.addEventListener('pointerdown', (ev) => ev.stopPropagation());
      gear.addEventListener('click', (ev) => { ev.stopPropagation(); lab.toggle(); });
      if (/(^#|&)lab(&|$)/.test(location.hash)) lab.show();
      // #admin (or the legacy #test) opens the tuning sheet straight away;
      // so does a 1 s hold on the landing screen's bottom-right corner.
      if (/(^#|&)(admin|test)(&|$)/.test(location.hash)) panel.show();
      window.heptaweave = { params, renderer, panel, lab, app };
    }
  </script>
